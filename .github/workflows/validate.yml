name: validate
on: [pull_request, push]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python scripts/sync_upstream.py --check
      - run: uv run pytest -q
      - name: Check installed readers and bundled pins
        run: |
          uv pip install --force-reinstall --no-deps .
          uv run --no-sync python -I -m pytest -q -o pythonpath= tests/test_recipe_release.py tests/test_priority.py
  # the same tests again with the geospatial libraries installed, so the raster, road and figure tests run
  # instead of being skipped
  geo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra geo --extra hf --extra viz
      - run: uv run pytest -q -rs
